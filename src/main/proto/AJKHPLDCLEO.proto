syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AJKHPLDCLEOOuterClass";

import "EIHOFHPLHMH.proto";

message AJKHPLDCLEO {
	bool is_open = 1;
	repeated EIHOFHPLHMH BMJDALKAMOO = 11;
	uint32 score = 4;
	uint32 level_id = 7;
	bool is_finish = 3;
}
