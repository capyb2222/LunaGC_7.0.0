syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AbilityInvokeEntryOuterClass";

import "AbilityInvokeArgument.proto";
import "AbilityInvokeEntryHead.proto";
import "ForwardType.proto";

message AbilityInvokeEntry {
	uint32 event_id = 6;
	double total_tick_time = 12;
	AbilityInvokeEntryHead head = 9;
	bool is_ignore_auth = 15;
	bytes ability_data = 8;
	AbilityInvokeArgument argument_type = 10;
	uint32 entity_id = 13;
	ForwardType forward_type = 7;
	uint32 forward_peer = 5;
}
