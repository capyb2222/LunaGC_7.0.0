syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AbilityInvokeEntryHeadOuterClass";

import "LJGEHMILKEM.proto";

message AbilityInvokeEntryHead {
	int32 modifier_config_local_id = 13;
	uint32 server_buff_uid = 12;
	uint32 instanced_ability_id = 4;
	uint32 instanced_modifier_id = 3;
