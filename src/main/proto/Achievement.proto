syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AchievementOuterClass";

message Achievement {
	enum Status {
		INVALID = 0;
		UNFINISHED = 1;
		FINISHED = 2;
		REWARD_TAKEN = 3;
	}
	uint32 finish_timestamp = 14;
	uint32 id = 11;
	uint32 cur_progress = 12;
	Status status = 3;
	uint32 total_progress = 10;
}
