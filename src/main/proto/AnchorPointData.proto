syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AnchorPointDataOuterClass";

import "Vector.proto";

message AnchorPointData {
	uint32 material_id = 3;
	uint32 end_time = 5;
	uint32 anchor_point_id = 10;
	Vector pos = 7;
	Vector rot = 14;
	uint32 scene_id = 12;
}
