syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AsterLittleDetailInfoOuterClass";

import "AsterLittleStageState.proto";

message AsterLittleDetailInfo {
	uint32 begin_time = 11;
	uint32 stage_begin_time = 3;
	AsterLittleStageState stage_state = 6;
	bool is_open = 7;
	uint32 stage_id = 8;
}
