syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AsterMidDetailInfoOuterClass";

import "AsterMidCampInfo.proto";

message AsterMidDetailInfo {
	uint32 collect_count = 15;
	bool is_open = 6;
	uint32 begin_time = 10;
	repeated AsterMidCampInfo camp_list = 9;
}
