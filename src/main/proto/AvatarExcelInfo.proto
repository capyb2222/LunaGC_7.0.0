syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AvatarExcelInfoOuterClass";

message AvatarExcelInfo {
	uint64 prefab_path_hash = 50000;
	uint64 prefab_path_remote_hash = 50001;
	uint64 controller_path_hash = 50002;
	uint64 controller_path_remote_hash = 50003;
	uint64 combat_config_hash = 50004;
}
