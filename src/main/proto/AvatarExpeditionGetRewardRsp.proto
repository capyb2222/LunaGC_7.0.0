syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AvatarExpeditionGetRewardRspOuterClass";

import "AvatarExpeditionInfo.proto";
import "_AvatarExpeditionRewardInfo.proto";

message AvatarExpeditionGetRewardRsp {
	repeated int32 ANAMNOCEICO = 12;
	int32 retcode = 11;
	map<uint64, AvatarExpeditionInfo> expedition_info_map = 1;
	repeated _AvatarExpeditionRewardInfo _expedition_reward_list = 8;
}
