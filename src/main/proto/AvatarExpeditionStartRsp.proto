syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AvatarExpeditionStartRspOuterClass";

import "AvatarExpeditionInfo.proto";
import "_AvatarExpeditionBasicInfo.proto";

message AvatarExpeditionStartRsp {
	map<uint64, AvatarExpeditionInfo> expedition_info_map = 5;
	repeated _AvatarExpeditionBasicInfo _expedition_basic_info_list = 8;
	int32 retcode = 12;
	repeated int32 ILBIKNLHAKE = 14;
}
