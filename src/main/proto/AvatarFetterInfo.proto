syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AvatarFetterInfoOuterClass";

import "FetterData.proto";

message AvatarFetterInfo {
	uint32 exp_number = 50000;
	uint32 exp_level = 50001;
	repeated uint32 open_id_list = 50002;
	repeated uint32 finish_id_list = 50003;
	repeated uint32 rewarded_fetter_level_list = 50004;
	repeated FetterData fetter_list = 6;
}
