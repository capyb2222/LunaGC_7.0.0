syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AvatarFetterLevelRewardRspOuterClass";

message AvatarFetterLevelRewardRsp {
	repeated uint32 _reward_id_list = 4;
	uint32 fetter_level = 14;
	uint32 reward_id = 3;
	int32 retcode = 5;
	uint64 avatar_guid = 6;
}
