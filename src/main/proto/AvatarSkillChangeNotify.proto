syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "AvatarSkillChangeNotifyOuterClass";

message AvatarSkillChangeNotify {
	uint32 old_level = 2;
	uint32 entity_id = 6;
	uint32 skill_depot_id = 8;
	uint64 avatar_guid = 10;
	uint32 cur_level = 13;
	uint32 avatar_skill_id = 14;
}
