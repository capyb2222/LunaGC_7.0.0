syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BargainOfferPriceRspOuterClass";

import "BargainResultType.proto";

message BargainOfferPriceRsp {
	int32 retcode = 12;
	uint32 result_param = 7;
	int32 cur_mood = 6;
	BargainResultType bargain_result = 5;
}
