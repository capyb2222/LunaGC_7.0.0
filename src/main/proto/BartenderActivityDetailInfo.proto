syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BartenderActivityDetailInfoOuterClass";

import "BartenderLevelInfo.proto";
import "BartenderTaskInfo.proto";

message BartenderActivityDetailInfo {
	repeated BartenderTaskInfo unlock_task_list = 6;
	repeated BartenderLevelInfo unlock_level_list = 4;
	repeated uint32 ENBFJNEEJNP = 50000;
	bool is_content_closed = 15;
	bool is_develop_module_open = 11;
	repeated uint32 PCPKHLCPABB = 50001;
}
