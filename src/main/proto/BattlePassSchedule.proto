syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BattlePassScheduleOuterClass";

import "BattlePassCycle.proto";
import "BattlePassProduct.proto";
import "BattlePassRewardPlanOption.proto";
import "BattlePassRewardTag.proto";
import "BattlePassUnlockStatus.proto";

message BattlePassSchedule {
	BattlePassProduct product_info = 6;
	bool is_viewed = 14;
	BattlePassUnlockStatus unlock_status = 12;
	repeated BattlePassRewardTag reward_taken_list = 13;
	uint32 end_time = 8;
	BattlePassCycle cur_cycle = 1;
	uint32 schedule_id = 11;
	bool is_extra_paid_reward_taken = 4;
	bool JIPEKMKKHOI = 5;
	uint32 begin_time = 10;
	uint32 level = 7;
	uint32 paid_platform_flags = 50000;
	uint32 cur_cycle_points = 50001;
	uint32 point = 3;
	repeated BattlePassRewardPlanOption _reward_plan_option_list = 2;
}
