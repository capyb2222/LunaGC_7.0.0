syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BattlePassScheduleOuterClass";

import "BattlePassCycle.proto";
import "BattlePassProduct.proto";
import "BattlePassRewardPlanOption.proto";
import "BattlePassRewardTag.proto";
import "BattlePassUnlockStatus.proto";

message BattlePassSchedule {
	BattlePassProduct product_info = 1;
	bool is_viewed = 2;
	BattlePassUnlockStatus unlock_status = 3;
	repeated BattlePassRewardTag reward_taken_list = 4;
	uint32 end_time = 5;
	BattlePassCycle cur_cycle = 6;
	uint32 schedule_id = 7;
	bool is_extra_paid_reward_taken = 8;
	bool JIPEKMKKHOI = 9;
	uint32 begin_time = 10;
	uint32 level = 11;
	uint32 paid_platform_flags = 12;
	uint32 cur_cycle_points = 13;
	uint32 point = 14;
	repeated BattlePassRewardPlanOption _reward_plan_option_list = 15;
}
