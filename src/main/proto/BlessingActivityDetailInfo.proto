syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BlessingActivityDetailInfoOuterClass";

message BlessingActivityDetailInfo {
	uint32 HLGJOMHPMDA = 10;
	bool is_content_closed = 5;
	uint32 next_refresh_time = 13;
	uint32 ppbchanjknf = 3;
	bool is_activated = 15;
	map<uint32, uint32> pic_num_map = 2;
	uint32 DKHOJDNIKGN = 7;
	uint32 content_close_time = 8;
}
