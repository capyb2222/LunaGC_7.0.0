syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BlitzRushActivityDetailInfoOuterClass";

import "BlitzRushStage.proto";
import "ParkourLevelInfo.proto";

message BlitzRushActivityDetailInfo {
	uint32 content_close_time = 12;
	repeated ParkourLevelInfo parkour_level_info_list = 2;
	repeated BlitzRushStage stage_list = 1;
	bool is_content_closed = 10;
}
