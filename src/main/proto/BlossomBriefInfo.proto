syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BlossomBriefInfoOuterClass";

import "Vector.proto";

message BlossomBriefInfo {
	uint32 scene_id = 6;
	uint32 monster_level = 3;
	uint32 _map_layer_id = 1;
	uint32 city_id = 7;
	uint32 refresh_id = 11;
	uint32 state = 12;
	uint32 resin = 2;
	uint32 circle_camp_id = 4;
	uint32 reward_id = 5;
	Vector pos = 14;
	bool is_guide_opened = 10;
}
