syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BrickBreakerLevelInfoOuterClass";

message BrickBreakerLevelInfo {
	repeated uint32 CFMEKCCEEPD = 9;
	uint32 level_id = 3;
	repeated uint32 DDKLHHHMMFJ = 10;
	bool is_finish = 5;
	uint32 max_score = 7;
	bool is_can_start = 4;
	repeated uint32 chosen_avatar_list = 14;
}
