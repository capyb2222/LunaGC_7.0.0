syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BuyGoodsRspOuterClass";

import "ShopGoods.proto";

message BuyGoodsRsp {
	int32 retcode = 4;
	ShopGoods goods = 50000;
	uint32 buy_count = 7;
	uint32 shop_type = 15;
	repeated ShopGoods goods_list = 5;
}
