syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CCINMGMEJBNOuterClass";

import "GBLGAGAPIFE.proto";

message CCINMGMEJBN {
	repeated GBLGAGAPIFE NBFDAIOLGFI = 10;
	bool is_open = 14;
	bool is_finish = 3;
	uint32 stage_id = 12;
	uint32 best_score = 9;
}
