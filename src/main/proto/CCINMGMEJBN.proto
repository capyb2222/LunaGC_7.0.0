syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CCINMGMEJBNOuterClass";

import "GBLGAGAPIFE.proto";

message CCINMGMEJBN {
	repeated GBLGAGAPIFE NBFDAIOLGFI = 2;
	bool is_open = 5;
	bool is_finish = 9;
	uint32 stage_id = 10;
	uint32 best_score = 12;
}
