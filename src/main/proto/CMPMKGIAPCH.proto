syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CMPMKGIAPCHOuterClass";

import "LIBEGKHPMPN.proto";
import "_CurrentPhase.proto";
import "_EquipStuff.proto";
import "_NormalStuff.proto";

message CMPMKGIAPCH {
	oneof detail {
		_NormalStuff normal_stuff = 100;
		_EquipStuff equip_stuff = 101;
	}
	_CurrentPhase KDPEFOBKJON = 1;
	LIBEGKHPMPN OHBGNHAAMIB = 2;
	uint32 guid = 3;
}
