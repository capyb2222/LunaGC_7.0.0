syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ChannelerSlabChallengeStageOuterClass";

import "ChannelerSlabChallenge.proto";
import "ChannelerSlabOneoffDungeon.proto";

message ChannelerSlabChallengeStage {
	repeated ChannelerSlabChallenge challenge_list = 2;
	uint32 stage_id = 15;
	uint32 open_time = 4;
	ChannelerSlabOneoffDungeon dungeon_info = 14;
	bool is_open = 12;
}
