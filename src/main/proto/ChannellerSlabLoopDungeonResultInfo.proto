syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ChannellerSlabLoopDungeonResultInfoOuterClass";

message ChannellerSlabLoopDungeonResultInfo {
	bool is_success = 9;
	bool is_in_time_limit = 10;
	uint32 challenge_max_score = 6;
	uint32 dungeon_index = 13;
	uint32 challenge_score = 15;
}
