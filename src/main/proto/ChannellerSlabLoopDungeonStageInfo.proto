syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ChannellerSlabLoopDungeonStageInfoOuterClass";

import "ChannellerSlabLoopDungeonInfo.proto";

message ChannellerSlabLoopDungeonStageInfo {
	repeated ChannellerSlabLoopDungeonInfo dungeon_info_list = 2;
	repeated uint32 taken_reward_index_list = 5;
	uint32 open_time = 9;
	uint32 last_difficulty_id = 6;
	bool is_open = 12;
}
