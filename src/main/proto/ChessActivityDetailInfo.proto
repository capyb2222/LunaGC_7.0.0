syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ChessActivityDetailInfoOuterClass";

message ChessActivityDetailInfo {
	uint32 MNMFHCLBLMH = 50000;
	uint32 exp = 13;
	uint32 content_close_time = 10;
	uint32 level = 7;
	bool is_teach_dungeon_finished = 11;
	repeated uint32 finished_map_id_list = 1;
	uint32 MMJCFABPFPE = 50001;
	uint32 AIHKOHFLHLC = 50002;
	bool is_content_closed = 9;
}
