syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CodexDataFullNotifyOuterClass";

import "CodexTypeData.proto";

message CodexDataFullNotify {
	uint32 last_read_pushtips_codex_id = 50000;
	repeated uint32 recent_viewed_pushtips_list = 6;
	uint32 last_read_pushtips_type_id = 50001;
	repeated CodexTypeData type_data_list = 15;
}
