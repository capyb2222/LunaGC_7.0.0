syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CodexTypeDataOuterClass";

import "CodexType.proto";

message CodexTypeData {
	map<uint32, uint32> weapon_max_promote_level_map = 5;
	repeated bool have_viewed_list = 11;
	CodexType type = 4;
	repeated uint32 codex_id_list = 2;
}
