syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CoinCollectTeamInfoDataOuterClass";

message CoinCollectTeamInfoData {
	bool is_host = 1;
	uint32 choose_skill_no = 4;
	repeated uint32 avatar_id_list = 6;
	uint32 player_uid = 8;
	repeated uint32 GKOLDEDJJDO = 11;
	repeated uint32 HJPAFNAACNO = 14;
}
