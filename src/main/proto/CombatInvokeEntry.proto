syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CombatInvokeEntryOuterClass";

import "CombatTypeArgument.proto";
import "ForwardType.proto";

message CombatInvokeEntry {
	CombatTypeArgument argument_type = 6;
	ForwardType forward_type = 4;
	bytes combat_data = 15;
	uint32 LDAODDFLPGB = 10;
}
