syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CombineRspOuterClass";

import "ItemParam.proto";

message CombineRsp {
	uint32 combine_count = 15;
	repeated ItemParam FBMBEJKABDH = 50000;
	repeated ItemParam DAPJDPKECGP = 50001;
	repeated ItemParam FIHLCAAADMG = 50002;
	repeated ItemParam result_item_list = 50003;
	int32 retcode = 2;
	uint64 avatar_guid = 4;
	uint32 combine_id = 14;
	repeated ItemParam totalExtraItemList = 50004;
	repeated ItemParam cost_item_list = 12;
}
