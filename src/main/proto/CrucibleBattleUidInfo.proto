syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CrucibleBattleUidInfoOuterClass";

import "ProfilePicture.proto";

message CrucibleBattleUidInfo {
	string nickname = 1;
	uint32 uid = 3;
	string online_id = 6;
	ProfilePicture profile_picture = 12;
	uint32 icon = 14;
}
