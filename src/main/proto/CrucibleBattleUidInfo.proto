syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CrucibleBattleUidInfoOuterClass";

import "ProfilePicture.proto";

message CrucibleBattleUidInfo {
	string nickname = 6;
	uint32 uid = 14;
	string online_id = 3;
	ProfilePicture profile_picture = 7;
	uint32 icon = 4;
}
