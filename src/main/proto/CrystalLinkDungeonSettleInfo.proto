syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "CrystalLinkDungeonSettleInfoOuterClass";

message CrystalLinkDungeonSettleInfo {
	bool pdkdbgnjpdl = 1;
	uint32 difficulty_id = 3;
	uint32 kill_elite_monster_num = 8;
	uint32 kill_normal_mosnter_num = 9;
	bool is_new_record = 10;
	uint32 level_id = 13;
	uint32 final_score = 15;
}
