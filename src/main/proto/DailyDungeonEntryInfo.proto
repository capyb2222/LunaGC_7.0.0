syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DailyDungeonEntryInfoOuterClass";

import "DungeonEntryInfo.proto";

message DailyDungeonEntryInfo {
	bool EDEOIILGGJC = 50000;
	bool is_quick_open = 5;
	uint32 recommend_dungeon_id = 7;
	DungeonEntryInfo recommend_dungeon_entry_info = 14;
	bool AKNPDDFHEKO = 50001;
	uint32 dungeon_entry_id = 6;
	uint32 dungeon_entry_config_id = 13;
	repeated uint32 haoiogcmaim = 2;
}
