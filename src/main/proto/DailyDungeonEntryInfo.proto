syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DailyDungeonEntryInfoOuterClass";

import "DungeonEntryInfo.proto";

message DailyDungeonEntryInfo {
	bool EDEOIILGGJC = 4;
	bool is_quick_open = 5;
	uint32 recommend_dungeon_id = 8;
	DungeonEntryInfo recommend_dungeon_entry_info = 9;
	bool AKNPDDFHEKO = 10;
	uint32 dungeon_entry_id = 11;
	uint32 dungeon_entry_config_id = 12;
	repeated uint32 haoiogcmaim = 15;
}
