syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DetailAbilityInfoOuterClass";

import "AbilityString.proto";

message DetailAbilityInfo {
	uint32 instanced_modifier_id = 5;
	int32 modifier_local_id = 4;
	int32 local_id = 11;
	uint32 instanced_ability_id = 1;
	AbilityString parent_ability_name = 6;
	uint32 caster_id = 10;
}
