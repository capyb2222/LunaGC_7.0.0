syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DoGachaRspOuterClass";

import "GachaItem.proto";

message DoGachaRsp {
	uint32 ten_cost_item_num = 1;
	uint32 left_gacha_times = 2;
	uint32 gacha_times = 3;
	uint32 gacha_times_limit = 4;
	int32 retcode = 5;
	uint32 cost_item_id = 6;
	uint32 gacha_type = 7;
	uint32 gacha_schedule_id = 8;
	uint32 wish_progress = 9;
	uint32 cost_item_num = 10;
	uint32 ten_cost_item_id = 11;
	uint32 JHDANIPDIPO = 12;
	repeated GachaItem gacha_item_list = 13;
	uint32 JHGDJIHMNGO = 14;
	uint32 new_gacha_random = 15;
	uint32 cur_schedule_daily_gacha_times = 116;
	bool LHBELFNPPNK = 849;
	bool BKMCHIJHJJE = 1149;
	bool NLGHNJJMGIM = 1619;
	uint32 daily_gacha_times = 1949;
}
