syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DragonSpineActivityDetailInfoOuterClass";

import "DragonSpineChapterInfo.proto";

message DragonSpineActivityDetailInfo {
	uint32 dnodgcmpoan = 50000;
	uint32 ABBFOLNPGNE = 50001;
	bool is_content_closed = 9;
	uint32 content_finish_time = 3;
	uint32 weapon_enhance_level = 11;
	uint32 GNADEDJKAJM = 50002;
	repeated DragonSpineChapterInfo chapter_info_list = 6;
}
