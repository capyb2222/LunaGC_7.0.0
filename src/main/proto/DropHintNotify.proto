syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DropHintNotifyOuterClass";

import "Vector.proto";

message DropHintNotify {
	repeated uint32 item_id_list = 15;
	bool AJDBEGMCGKD = 1;
	Vector position = 14;
	Vector rotation = 3;
	uint32 entity_id = 11;
}
