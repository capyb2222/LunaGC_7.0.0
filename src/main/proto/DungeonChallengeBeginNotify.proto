syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DungeonChallengeBeginNotifyOuterClass";

message DungeonChallengeBeginNotify {
	uint32 father_index = 5;
	uint32 challenge_index = 12;
	repeated uint32 uid_list = 9;
	uint32 challenge_id = 13;
	uint32 group_id = 6;
	repeated uint32 param_list = 15;
}
