syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DungeonChallengeFinishNotifyOuterClass";

import "ChallengeFinishType.proto";
import "ChannellerSlabLoopDungeonResultInfo.proto";
import "CustomDungeonResultInfo.proto";
import "EffigyChallengeDungeonResultInfo.proto";
import "PotionDungeonResultInfo.proto";
import "StrengthenPointData.proto";

message DungeonChallengeFinishNotify {
	oneof detail {
		ChannellerSlabLoopDungeonResultInfo channeller_slab_loop_dungeon_result_info = 1574;
		PotionDungeonResultInfo potion_dungeon_result_info = 1222;
		CustomDungeonResultInfo custom_dungeon_result_info = 1687;
		EffigyChallengeDungeonResultInfo effigy_challenge_dungeon_result_info = 1019;
	}
	bool is_new_record = 15;
	uint32 time_cost = 3;
	uint32 challenge_record_type = 14;
	map<uint32, StrengthenPointData> strengthen_point_data_map = 8;
	ChallengeFinishType finish_type = 10;
	uint32 current_value = 6;
	uint32 challenge_index = 4;
	bool is_success = 7;
}
