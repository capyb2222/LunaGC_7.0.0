syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "DungeonEntryInfoRspOuterClass";

import "DungeonEntryInfo.proto";
import "DungeonEntryPointInfo.proto";

message DungeonEntryInfoRsp {
	int32 retcode = 12;
	uint32 point_id = 6;
	uint32 recommend_dungeon_id = 3;
	repeated DungeonEntryInfo dungeon_entry_list = 7;
	uint32 _first_pass_reward_status = 8;
	bool jpmdjmadpil = 2;
	repeated DungeonEntryPointInfo dungeon_entry_point_list = 1;
}
