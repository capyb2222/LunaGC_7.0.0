syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EDLMACJNHGPOuterClass";

import "ProfilePicture.proto";

message EDLMACJNHGP {
	string _xbox_gamertag = 10;
	string _creator_online_id = 13;
	string psn_id = 6;
	string nickname = 2;
	ProfilePicture profile_picture = 5;
	fixed64 LPGBINFHLJD = 15;
	string _xuid = 7;
	uint32 uid = 12;
}
