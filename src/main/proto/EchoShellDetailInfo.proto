syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EchoShellDetailInfoOuterClass";

import "SummerTimeDungeonInfo.proto";

message EchoShellDetailInfo {
	repeated uint32 MBGIBFEEOLH = 50000;
	repeated uint32 FHIALFGIKKC = 50001;
	repeated SummerTimeDungeonInfo summer_time_dungeon_list = 7;
	repeated uint32 taken_reward_list = 13;
}
