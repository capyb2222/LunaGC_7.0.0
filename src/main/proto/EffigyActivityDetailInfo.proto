syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EffigyActivityDetailInfoOuterClass";

import "EffigyDailyInfo.proto";

message EffigyActivityDetailInfo {
	uint32 last_difficulty_id = 3;
	repeated uint32 taken_reward_index_list = 8;
	repeated EffigyDailyInfo daily_info_list = 11;
	uint32 cur_score = 12;
}
