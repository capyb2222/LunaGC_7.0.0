syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EffigyChallengeDungeonResultInfoOuterClass";

message EffigyChallengeDungeonResultInfo {
	bool is_in_time_limit = 3;
	bool is_success = 7;
	uint32 challenge_id = 10;
	uint32 challenge_max_score = 14;
	uint32 challenge_score = 15;
}
