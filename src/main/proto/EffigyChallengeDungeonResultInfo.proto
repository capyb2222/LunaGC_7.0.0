syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EffigyChallengeDungeonResultInfoOuterClass";

message EffigyChallengeDungeonResultInfo {
	bool is_in_time_limit = 9;
	bool is_success = 10;
	uint32 challenge_id = 8;
	uint32 challenge_max_score = 1;
	uint32 challenge_score = 13;
}
