syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EffigyDailyInfoOuterClass";

message EffigyDailyInfo {
	uint32 challenge_max_score = 2;
	uint32 challenge_id = 4;
	uint32 kdllalbpple = 5;
	uint32 day_index = 6;
	uint32 begin_time = 13;
	uint32 bojlbfloapn = 14;
	bool is_first_pass_reward_taken = 15;
}
