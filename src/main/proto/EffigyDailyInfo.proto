syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EffigyDailyInfoOuterClass";

message EffigyDailyInfo {
	uint32 challenge_max_score = 6;
	uint32 challenge_id = 9;
	uint32 kdllalbpple = 50000;
	uint32 day_index = 7;
	uint32 begin_time = 15;
	uint32 bojlbfloapn = 50001;
	bool is_first_pass_reward_taken = 14;
}
