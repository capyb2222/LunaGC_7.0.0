syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtAvatarLockChairRspOuterClass";

import "Vector.proto";

message EvtAvatarLockChairRsp {
	uint64 chair_id = 13;
	int32 retcode = 12;
	Vector position = 8;
	int32 direction = 7;
	uint32 entity_id = 14;
}
