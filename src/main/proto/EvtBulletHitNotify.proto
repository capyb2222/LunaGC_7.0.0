syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtBulletHitNotifyOuterClass";

import "ForwardType.proto";
import "HitColliderType.proto";
import "Vector.proto";

message EvtBulletHitNotify {
	uint32 single_bullet_id = 1;
	uint32 entity_id = 4;
	int32 hit_box_index = 6;
	HitColliderType hit_collider_type = 9;
	uint32 hit_entity_id = 10;
	uint32 forward_peer = 12;
	Vector hit_point = 13;
	ForwardType forward_type = 14;
	Vector hit_normal = 15;
}
