syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtDoSkillSuccNotifyOuterClass";

import "ForwardType.proto";
import "Vector.proto";

message EvtDoSkillSuccNotify {
	uint32 skill_id = 10;
	Vector forward = 5;
	uint32 caster_id = 9;
	ForwardType forward_type = 13;
}
