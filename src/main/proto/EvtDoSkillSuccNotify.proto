syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtDoSkillSuccNotifyOuterClass";

import "ForwardType.proto";
import "Vector.proto";

message EvtDoSkillSuccNotify {
	uint32 skill_id = 4;
	Vector forward = 10;
	uint32 caster_id = 11;
	ForwardType forward_type = 15;
}
