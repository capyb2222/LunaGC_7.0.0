syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "EvtEntityRenderersChangedNotifyOuterClass";

import "EntityRendererChangedInfo.proto";
import "ForwardType.proto";

message EvtEntityRenderersChangedNotify {
	bool is_server_cache = 15;
	EntityRendererChangedInfo renderer_changed_info = 13;
	uint32 entity_id = 11;
	ForwardType forward_type = 12;
}
