syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "FIIHDNCNDHHOuterClass";

import "FHDOGFCDKDK.proto";

message FIIHDNCNDHH {
	uint32 start_time = 6;
	uint64 guid = 8;
	repeated FHDOGFCDKDK COKFKPJNKHC = 4;
	repeated uint32 winner_uid_list = 12;
	uint32 finish_time = 9;
}
