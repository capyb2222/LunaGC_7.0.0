syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "FindHilichurlDetailInfoOuterClass";

import "FindHilichurlDayContentInfo.proto";

message FindHilichurlDetailInfo {
	bool is_content_closed = 2;
	uint32 day_index = 3;
	bool is_end_quest_accept = 5;
	repeated FindHilichurlDayContentInfo day_content_info_list = 7;
	uint32 player_day_index = 9;
	uint32 min_open_player_level = 13;
	uint32 content_close_time = 14;
}
