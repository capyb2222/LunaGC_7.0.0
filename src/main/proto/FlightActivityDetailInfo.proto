syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "FlightActivityDetailInfoOuterClass";

import "FlightDailyRecord.proto";

message FlightActivityDetailInfo {
	repeated FlightDailyRecord daily_record_list = 8;
	uint32 preview_reward_id = 9;
	uint32 min_open_player_level = 12;
}
