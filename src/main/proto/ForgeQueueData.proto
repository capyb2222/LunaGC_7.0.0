syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ForgeQueueDataOuterClass";

message ForgeQueueData {
	uint32 total_finish_timestamp = 50000;
	uint32 forge_id = 1;
	uint32 next_finish_timestamp = 50001;
	uint32 finish_count = 10;
	uint32 queue_id = 50002;
	uint32 unfinish_count = 50003;
	uint32 avatar_id = 2;
}
