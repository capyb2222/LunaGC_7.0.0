syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "FungusTrainingProgressDetailOuterClass";

import "FungusFighterMonsterDetail.proto";
import "FungusTrainingPoolPreviewDetail.proto";

message FungusTrainingProgressDetail {
	repeated uint32 BJKNGIJCKOE = 50000;
	uint32 dungeon_id = 11;
	uint32 total_used_time = 12;
	repeated FungusTrainingPoolPreviewDetail monster_pool_preview_list = 50001;
	uint32 cur_round = 15;
	repeated uint32 HLMGKMNFOOF = 50002;
	repeated FungusFighterMonsterDetail monster_detail_list = 50003;
}
