syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GachaActivityDetailInfoOuterClass";

import "GachaStageData.proto";

message GachaActivityDetailInfo {
	repeated uint32 have_get_robot_list = 1;
	uint32 LAJGHCOADJM = 2;
	uint32 MFPKJNHGEIO = 6;
	map<uint32, uint32> robot_num_map = 7;
	map<uint32, uint32> have_reward_robot_num_map = 13;
	repeated GachaStageData gacha_stage_data_list = 14;
}
