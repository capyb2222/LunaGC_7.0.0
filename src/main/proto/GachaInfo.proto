syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GachaInfoOuterClass";

import "GachaUpInfo.proto";

message GachaInfo {
	string gacha_preview_prefab_path = 50000;
	uint32 ten_cost_item_id = 50001;
	uint32 gacha_type = 2;
	uint32 begin_time = 6;
	uint32 schedule_id = 1;
	uint32 left_gacha_times = 50002;
	uint32 ten_cost_item_num = 50003;
	uint32 gacha_times_limit = 50004;
	uint32 cost_item_id = 50005;
	string gacha_record_url = 50006;
	uint32 cost_item_num = 50007;
	string gacha_prob_url = 50008;
	string gacha_prefab_path = 50009;
	uint32 end_time = 3;
	uint32 gacha_sort_id = 11;
	repeated uint32 display_chronicle_5_item_list = 50010;
	bool HMOJLEMLHDK = 50011;
	repeated uint32 display_up4_item_list = 50012;
	bool is_new_wish = 50013;
	repeated uint32 display_up5_item_list = 50014;
	string gacha_record_url_oversea = 50015;
	string gacha_prob_url_oversea = 50016;
	string title_textmap = 50017;
	uint32 wish_max_progress = 50018;
	uint32 wish_progress = 50019;
	uint32 cur_schedule_daily_gacha_times = 50020;
	uint32 wish_item_id = 50021;
	repeated GachaUpInfo gacha_up_info_list = 1931;
}
