syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GachaWishRspOuterClass";

message GachaWishRsp {
	uint32 wish_item_id = 50000;
	uint32 gacha_schedule_id = 1;
	int32 retcode = 7;
	uint32 wish_progress = 50001;
	uint32 gacha_type = 2;
	uint32 wish_max_progress = 50002;
}
