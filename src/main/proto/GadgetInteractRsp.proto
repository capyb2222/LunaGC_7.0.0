syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GadgetInteractRspOuterClass";

import "InterOpType.proto";
import "InteractType.proto";

message GadgetInteractRsp {
	InteractType interact_type = 4;
	int32 retcode = 6;
	uint32 hebnjoabfoo = 7;
	uint32 gadget_id = 13;
	uint32 gadget_entity_id = 14;
	InterOpType op_type = 15;
}
