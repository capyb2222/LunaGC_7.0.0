syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetCompoundDataRspOuterClass";

import "CompoundQueueData.proto";

message GetCompoundDataRsp {
	repeated uint32 unlock_compound_list = 6;
	repeated CompoundQueueData compound_que_data_list = 4;
	int32 retcode = 1;
}
