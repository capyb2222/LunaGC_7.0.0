syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetCompoundDataRspOuterClass";

import "CompoundQueueData.proto";

message GetCompoundDataRsp {
	repeated uint32 unlock_compound_list = 2;
	repeated CompoundQueueData compound_que_data_list = 8;
	int32 retcode = 13;
}
