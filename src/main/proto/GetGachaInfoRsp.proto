syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetGachaInfoRspOuterClass";

import "GachaInfo.proto";

message GetGachaInfoRsp {
	bool is_under_general_restrict = 50000;
	uint32 gacha_random = 11;
	bool is_under_minors_restrict = 50001;
	repeated GachaInfo gacha_info_list = 14;
	uint32 daily_gacha_times = 1;
	int32 retcode = 13;
}
