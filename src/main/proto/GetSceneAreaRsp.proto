syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetSceneAreaRspOuterClass";

import "CityInfo.proto";

message GetSceneAreaRsp {
	repeated CityInfo city_info_list = 8;
	uint32 scene_id = 11;
	repeated uint32 area_id_list = 15;
	int32 retcode = 10;
}
