syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetUgcBriefInfoRspOuterClass";

import "UgcMusicBriefInfo.proto";
import "UgcType.proto";

message GetUgcBriefInfoRsp {
	optional UgcMusicBriefInfo music_brief_info = 6;
	uint64 ugc_guid = 7;
	UgcType ugc_type = 10;
	int32 retcode = 13;
}
