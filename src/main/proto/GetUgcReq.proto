syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetUgcReqOuterClass";

import "GetUgcType.proto";
import "RecordUsage.proto";
import "UgcType.proto";

message GetUgcReq {
	uint64 ugc_guid = 3;
	RecordUsage ugc_record_usage = 9;
	UgcType ugc_type = 10;
	GetUgcType get_ugc_type = 12;
	bool is_require_brief = 13;
	uint32 schedule_id = 15;
}
