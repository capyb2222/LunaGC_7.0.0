syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetUgcReqOuterClass";

import "GetUgcType.proto";
import "RecordUsage.proto";
import "UgcType.proto";

message GetUgcReq {
	uint64 ugc_guid = 10;
	RecordUsage ugc_record_usage = 7;
	UgcType ugc_type = 3;
	GetUgcType get_ugc_type = 13;
	bool is_require_brief = 15;
	uint32 schedule_id = 11;
}
