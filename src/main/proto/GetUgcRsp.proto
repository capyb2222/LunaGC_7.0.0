syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetUgcRspOuterClass";

import "RecordUsage.proto";
import "UgcMusicBriefInfo.proto";
import "UgcMusicRecord.proto";
import "UgcType.proto";
import "_UgcLanV5CardBriefInfo.proto";
import "_UgcLanV5CardRecord.proto";
import "_UgcShortVideoBriefInfo.proto";
import "_UgcShortVideoRecord.proto";

message GetUgcRsp {
	oneof brief {
		_UgcShortVideoBriefInfo short_video_brief_info = 448;
		_UgcLanV5CardBriefInfo lan_v5_card_brief_info = 671;
		UgcMusicBriefInfo music_brief_info = 819;
	}
	oneof record {
		_UgcLanV5CardRecord lan_v5_card_record = 1;
		_UgcShortVideoRecord short_video_record = 4;
		UgcMusicRecord music_record = 7;
	}
	RecordUsage ugc_record_usage = 3;
	uint64 ugc_guid = 6;
	int32 retcode = 10;
	UgcType ugc_type = 13;
}
