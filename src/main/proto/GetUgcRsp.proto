syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GetUgcRspOuterClass";

import "RecordUsage.proto";
import "UgcMusicBriefInfo.proto";
import "UgcMusicRecord.proto";
import "UgcType.proto";
import "_UgcLanV5CardBriefInfo.proto";
import "_UgcLanV5CardRecord.proto";
import "_UgcShortVideoBriefInfo.proto";
import "_UgcShortVideoRecord.proto";

message GetUgcRsp {
	oneof brief {
		_UgcShortVideoBriefInfo short_video_brief_info = 1745;
		_UgcLanV5CardBriefInfo lan_v5_card_brief_info = 1133;
		UgcMusicBriefInfo music_brief_info = 1952;
	}
	oneof record {
		_UgcLanV5CardRecord lan_v5_card_record = 8;
		_UgcShortVideoRecord short_video_record = 6;
		UgcMusicRecord music_record = 13;
	}
	RecordUsage ugc_record_usage = 7;
	uint64 ugc_guid = 9;
	int32 retcode = 2;
	UgcType ugc_type = 10;
}
