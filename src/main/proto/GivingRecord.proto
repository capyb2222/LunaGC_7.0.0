syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GivingRecordOuterClass";

message GivingRecord {
	uint32 config_id = 2;
	uint32 group_id = 14;
	bool is_finished = 7;
	uint32 last_group_id = 6;
	map<uint32, uint32> material_cnt_map = 1;
	uint32 giving_id = 10;
	bool is_gadget_giving = 9;
}
