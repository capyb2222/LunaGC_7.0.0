syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HDHLLCCCLJMOuterClass";

import "DDBNDHNGEMF.proto";
import "PFFMGFPKANE.proto";

message HDHLLCCCLJM {
	uint32 difficulty = 11;
	bool OIFKDFIFIOP = 14;
	fixed64 timestamp = 10;
	repeated DDBNDHNGEMF KDFMEPMGGHJ = 7;
	repeated PFFMGFPKANE player_info_list = 2;
	uint32 schedule_id = 4;
}
