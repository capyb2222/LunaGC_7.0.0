syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HPIBBLDNIMEOuterClass";

import "_ActivityAvatarInfo.proto";

message HPIBBLDNIME {
	uint32 OKBGFHDDKCJ = 2;
	uint32 BOAKDOGPPPG = 4;
	repeated _ActivityAvatarInfo IHPPKPMKLHN = 7;
	bool is_open = 10;
	bool is_finish = 13;
	uint32 best_score = 14;
	uint32 level_id = 15;
}
