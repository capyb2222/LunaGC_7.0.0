syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HitCollisionOuterClass";

import "HitColliderType.proto";
import "Vector.proto";

message HitCollision {
	float OMEMJMGDNPP = 4;
	float PFLEHLDGODB = 7;
	int32 hit_box_index = 9;
	Vector hit_point = 10;
	HitColliderType hit_collider_type = 12;
	Vector hit_dir = 13;
	float EGIAGADINML = 15;
}
