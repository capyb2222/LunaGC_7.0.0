syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HitCollisionOuterClass";

import "HitColliderType.proto";
import "Vector.proto";

message HitCollision {
	float OMEMJMGDNPP = 50000;
	float PFLEHLDGODB = 50001;
	int32 hit_box_index = 15;
	Vector hit_point = 9;
	HitColliderType hit_collider_type = 5;
	Vector hit_dir = 12;
	float EGIAGADINML = 50002;
}
