syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HomeAvatarRewardEventNotifyOuterClass";

import "HomeAvatarRewardEventInfo.proto";

message HomeAvatarRewardEventNotify {
	bool is_event_trigger = 2;
	repeated HomeAvatarRewardEventInfo pending_list = 5;
	HomeAvatarRewardEventInfo reward_event = 9;
}
