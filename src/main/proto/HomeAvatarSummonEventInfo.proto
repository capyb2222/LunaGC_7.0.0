syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HomeAvatarSummonEventInfoOuterClass";

message HomeAvatarSummonEventInfo {
	uint32 guid = 14;
	uint32 avatar_id = 7;
	uint32 random_position = 5;
	uint32 event_over_time = 10;
	uint32 event_id = 12;
	uint32 suit_id = 15;
}
