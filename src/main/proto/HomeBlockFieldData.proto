syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HomeBlockFieldDataOuterClass";

import "HomeBlockSubFieldData.proto";
import "Vector.proto";

message HomeBlockFieldData {
	Vector rot = 7;
	Vector pos = 11;
	uint32 furniture_id = 1;
	uint32 guid = 12;
	repeated HomeBlockSubFieldData sub_field_list = 14;
}
