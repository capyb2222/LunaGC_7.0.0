syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HomeFurnitureDataOuterClass";

import "Vector.proto";

message HomeFurnitureData {
	int32 parent_furniture_index = 3;
	Vector spawn_pos = 5;
	uint32 version = 8;
	Vector spawn_rot = 10;
	uint32 guid = 11;
	uint32 furniture_id = 12;
}
