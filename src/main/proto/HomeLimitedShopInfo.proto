syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HomeLimitedShopInfoOuterClass";

import "Vector.proto";

message HomeLimitedShopInfo {
	fixed32 next_close_time = 50000;
	uint32 uid = 9;
	Vector djinn_pos = 4;
	fixed32 next_open_time = 50001;
	fixed32 next_guest_open_time = 50002;
	Vector djinn_rot = 6;
}
