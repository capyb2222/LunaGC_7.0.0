syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "HomeMarkPointSceneDataOuterClass";

import "HomeMarkPointFurnitureData.proto";
import "Vector.proto";

message HomeMarkPointSceneData {
	uint32 scene_id = 12;
	Vector safe_point_pos = 50000;
	uint32 module_id = 14;
	repeated HomeMarkPointFurnitureData furniture_list = 5;
	Vector teapot_spirit_pos = 50001;
}
