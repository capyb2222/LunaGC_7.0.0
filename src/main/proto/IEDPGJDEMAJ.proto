syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "IEDPGJDEMAJOuterClass";

import "_ActivityAvatarInfo.proto";

message IEDPGJDEMAJ {
	repeated uint32 AGILCKGHLME = 13;
	bool is_open = 7;
	bool is_finish = 9;
	uint32 level_id = 2;
	uint32 max_score = 4;
	repeated _ActivityAvatarInfo avatar_list = 12;
}
