syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "InstableSprayDungeonSettleInfoOuterClass";

message InstableSprayDungeonSettleInfo {
	uint32 difficulty = 2;
	uint32 round = 4;
	uint32 stage_id = 15;
	repeated uint32 score_list = 13;
	uint32 level_id = 10;
	bool is_new_record = 5;
}
