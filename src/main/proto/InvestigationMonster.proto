syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "InvestigationMonsterOuterClass";

import "_InvestigationMonsterDetail.proto";

message InvestigationMonster {
	enum LockState {
		LockState_LOCK_NONE = 0;
		LockState_LOCK_QUEST = 1;
	}
	uint32 id = 2;
	LockState lock_state = 7;
	uint32 city_id = 13;
	repeated _InvestigationMonsterDetail _investigation_monster_detail_list = 1167;
}
