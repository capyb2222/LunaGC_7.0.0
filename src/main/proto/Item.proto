syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ItemOuterClass";

import "Equip.proto";
import "Furniture.proto";
import "Material.proto";
import "_BeyondMaterial.proto";
import "_Facility.proto";
import "_TpsWeapon.proto";

message Item {
	oneof detail {
		Material material = 5;
		Equip equip = 6;
		Furniture furniture = 7;
		_BeyondMaterial beyond_material = 8;
		_Facility facility = 9;
		_TpsWeapon tps_weapon = 10;
	}
	uint32 item_id = 1;
	uint64 guid = 2;
}
