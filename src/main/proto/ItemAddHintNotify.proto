syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ItemAddHintNotifyOuterClass";

import "ItemHint.proto";
import "Vector.proto";

message ItemAddHintNotify {
	bool BLNCGGHFOMI = 50000;
	bool FPCIANIKMKE = 50001;
	uint32 reason = 11;
	Vector position = 5;
	uint32 quest_id = 6;
	repeated ItemHint overflow_transformed_item_list = 12;
	bool is_transfered_from_avatar_card = 50002;
	repeated ItemHint item_list = 13;
}
