syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "KLCNKCBIENBOuterClass";

import "EPHKKEDNINE.proto";
import "Uint32Pair.proto";

message KLCNKCBIENB {
	Uint32Pair progress = 12;
	uint32 hp = 5;
	uint32 HOAOJBKJFLE = 6;
	uint32 max_hp = 15;
	repeated EPHKKEDNINE CLKEEOEPJGB = 11;
}
