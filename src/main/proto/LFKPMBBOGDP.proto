syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "LFKPMBBOGDPOuterClass";

import "Vector.proto";

message LFKPMBBOGDP {
	bool is_finish = 3;
	uint32 open_time = 7;
	repeated uint32 GHGKAOABLFK = 4;
	bool is_open = 14;
	uint32 level_id = 2;
	Vector region_center_pos = 10;
	uint32 scene_id = 15;
	float region_radius = 1;
}
