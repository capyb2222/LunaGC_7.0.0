syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "LanternProjectionInfoOuterClass";

import "ClientInputType.proto";
import "LanternProjectionLevelInfo.proto";

message LanternProjectionInfo {
	repeated uint32 open_stage_list = 12;
	repeated LanternProjectionLevelInfo level_list = 5;
	repeated ClientInputType GOBNJOGJEMP = 50000;
	repeated ClientInputType PLJBMMAMJDL = 50001;
}
