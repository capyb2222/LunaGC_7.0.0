syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "LanternRiteFireworksStageInfoOuterClass";

import "LanternRiteFireworksChallengeInfo.proto";

message LanternRiteFireworksStageInfo {
	uint32 stage_id = 2;
	repeated LanternRiteFireworksChallengeInfo challenge_info_list = 14;
	bool is_open = 6;
}
