syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "LifeStateChangeNotifyOuterClass";

import "PlayerDieType.proto";
import "ServerBuff.proto";

message LifeStateChangeNotify {
	string attack_tag = 14;
	repeated string jodaadbmkka = 15;
	uint32 AFPBFDHCDNK = 4;
	uint32 source_entity_id = 10;
	uint32 entity_id = 5;
	uint32 life_state = 11;
	uint32 move_reliable_seq = 3;
	repeated ServerBuff server_buff_list = 6;
	uint32 LDAODDFLPGB = 8;
	uint32 client_sequence_id = 13;
	PlayerDieType die_type = 2;
}
