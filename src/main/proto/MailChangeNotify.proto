syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "MailChangeNotifyOuterClass";

import "MailData.proto";

message MailChangeNotify {
	repeated MailData mail_list = 6;
	repeated uint32 del_mail_id_list = 4;
	repeated MailData _change_mail_list = 5;
}
