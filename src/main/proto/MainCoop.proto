syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "MainCoopOuterClass";

message MainCoop {
	enum Status {
		INVALID = 0;
		RUNNING = 1;
		FINISHED = 2;
	}
	map<uint32, int32> HONMHLPABBF = 50000;
	repeated uint32 save_point_id_list = 15;
	uint32 self_confidence = 1;
	uint32 id = 4;
	map<uint32, int32> KAFJENECJNC = 50001;
	Status status = 5;
	map<uint32, uint32> seen_ending_map = 9;
}
