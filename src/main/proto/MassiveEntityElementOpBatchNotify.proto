syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "MassiveEntityElementOpBatchNotifyOuterClass";

import "ShapeBox.proto";
import "ShapeSphere.proto";

message MassiveEntityElementOpBatchNotify {
	oneof check_shape {
		ShapeSphere shape_sphere = 3;
		ShapeBox shape_box = 7;
	}
	int32 reaction_source_type = 50000;
	int32 entity_type = 15;
	int32 source_element_type = 50001;
	float attack_element_durability = 11;
	uint32 user_id = 50002;
	uint32 attacker_id = 14;
	uint32 op_idx = 50003;
}
