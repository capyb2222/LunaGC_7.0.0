syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "MassiveEntityElementOpBatchNotifyOuterClass";

import "ShapeBox.proto";
import "ShapeSphere.proto";

message MassiveEntityElementOpBatchNotify {
	oneof check_shape {
		ShapeSphere shape_sphere = 13;
		ShapeBox shape_box = 15;
	}
	int32 reaction_source_type = 1;
	int32 entity_type = 5;
	int32 source_element_type = 8;
	float attack_element_durability = 9;
	uint32 user_id = 10;
	uint32 attacker_id = 11;
	uint32 op_idx = 12;
}
