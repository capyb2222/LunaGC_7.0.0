syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "MichiaeMatsuriActivityDetailInfoOuterClass";

import "MichiaeMatsuriChallengePositionInfo.proto";
import "MichiaeMatsuriChestPositionInfo.proto";
import "MichiaeMatsuriStage.proto";

message MichiaeMatsuriActivityDetailInfo {
	uint32 gain_crystal_exp = 5;
	repeated MichiaeMatsuriChestPositionInfo chest_pos_list = 2;
	repeated MichiaeMatsuriStage stage_list = 3;
	repeated MichiaeMatsuriChallengePositionInfo challenge_pos_list = 11;
	repeated uint32 unlocked_crystal_skill_list = 13;
}
