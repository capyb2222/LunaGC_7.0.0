syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "MultiCharacterDungeonSettleInfoOuterClass";

import "IEDLOHFOJJB.proto";

message MultiCharacterDungeonSettleInfo {
	uint32 level_id = 1;
	uint32 stage_id = 4;
	repeated uint32 ajfidjinpll = 15;
	repeated IEDLOHFOJJB team_info_list = 11;
	uint32 difficulty = 10;
	bool is_new_record = 7;
}
