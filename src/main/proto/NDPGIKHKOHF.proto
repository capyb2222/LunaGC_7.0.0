syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "NDPGIKHKOHFOuterClass";

import "PFPIOBPBJMM.proto";

message NDPGIKHKOHF {
	uint32 stage_id = 6;
	uint32 NHEFNKONPEI = 9;
	uint32 MCBOJPBIBID = 7;
	bool is_open = 2;
	repeated PFPIOBPBJMM avatar_info_list = 8;
}
