syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "NHKBDCPGNMNOuterClass";

import "_ActivityAvatarInfo.proto";

message NHKBDCPGNMN {
	uint32 max_score = 6;
	bool is_open = 11;
	bool is_finish = 5;
	uint32 level_id = 1;
	repeated _ActivityAvatarInfo select_avatar_list = 7;
}
