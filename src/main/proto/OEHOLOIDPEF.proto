syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "OEHOLOIDPEFOuterClass";

import "_ActionPointsNoCostBuffInfo.proto";
import "_AddTotalRevenueAfterActionsExecBuffInfo.proto";
import "_ExpandToReduceUpgradeCostBuffInfo.proto";
import "_HireLevelUpgradeBuffInfo.proto";
import "_NoQuestApCostAfterQuestFinishBuffInfo.proto";
import "_RevenueBonusBuffInfo.proto";
import "_UpgradeToBonusFacilityRevenueBuffInfo.proto";

message OEHOLOIDPEF {
	oneof detail {
		_HireLevelUpgradeBuffInfo hire_level_upgrade_buff_info = 28;
		_RevenueBonusBuffInfo revenue_bonus_buff_info = 263;
		_AddTotalRevenueAfterActionsExecBuffInfo add_total_revenue_after_actions_exec_buff_info = 813;
		_UpgradeToBonusFacilityRevenueBuffInfo upgrade_to_bonus_facility_revenue_buff_info = 1145;
		_NoQuestApCostAfterQuestFinishBuffInfo no_quest_ap_cost_after_quest_finish_buff_info = 1238;
		_ActionPointsNoCostBuffInfo action_points_no_cost_buff_info = 1312;
		_ExpandToReduceUpgradeCostBuffInfo expand_to_reduce_upgrade_cost_buff_info = 1784;
	}
	uint32 guid = 2;
	uint32 level = 7;
	uint32 JCACGOEHBOA = 10;
	uint32 NNPEIMCDGIP = 13;
	uint32 buff_id = 14;
}
