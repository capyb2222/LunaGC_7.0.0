syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "OPOHILFOCHPOuterClass";

import "OJMLCFIPPAM.proto";

message OPOHILFOCHP {
	uint32 IAMHNPDGKNA = 12;
	repeated uint32 CNIPLLIJAFD = 8;
	repeated OJMLCFIPPAM level_info_list = 6;
	uint32 HMJDEIANCKN = 15;
	uint32 _win_count = 14;
}
