syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "OneoffGatherPointDetectorDataOuterClass";

import "Vector.proto";

message OneoffGatherPointDetectorData {
	uint32 map_layer_id = 50000;
	uint32 scene_id = 7;
	uint32 config_id = 9;
	uint32 group_id = 1;
	uint32 hint_radius = 14;
	Vector hint_center_pos = 2;
	bool is_all_collected = 3;
	bool is_hint_valid = 10;
	uint32 material_id = 12;
	uint32 _map_layer_id_x = 50001;
}
