syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PFFMGFPKANEOuterClass";

import "ProfilePicture.proto";

message PFFMGFPKANE {
	string _xbox_gamertag = 15;
	string online_id = 9;
	uint32 HLDCINAFEAJ = 5;
	ProfilePicture profile_picture = 11;
	bool NDJCMBBPOKH = 1;
	string nickname = 12;
	uint32 uid = 6;
}
