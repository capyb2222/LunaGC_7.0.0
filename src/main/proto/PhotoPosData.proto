syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PhotoPosDataOuterClass";

import "Vector.proto";

message PhotoPosData {
	bool is_view = 9;
	bool is_open = 2;
	uint32 pos_id = 10;
	uint32 open_time = 11;
	Vector center = 7;
	repeated uint32 MNLKHICGNNH = 4;
}
