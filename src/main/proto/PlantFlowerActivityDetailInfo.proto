syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlantFlowerActivityDetailInfoOuterClass";

message PlantFlowerActivityDetailInfo {
	bool is_today_has_awarded = 1;
	uint32 today_seed_reward_id = 13;
	map<uint32, uint32> JOIMIBFDKBA = 50000;
	uint32 day_index = 15;
	map<uint32, uint32> NKAHFKHPICE = 50001;
	bool is_content_closed = 7;
}
