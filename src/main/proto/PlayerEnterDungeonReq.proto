syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerEnterDungeonReqOuterClass";

import "DungeonEnterPosInfo.proto";

message PlayerEnterDungeonReq {
	uint32 BAEJLCIOPMI = 50000;
	DungeonEnterPosInfo enter_pos_info = 11;
	uint32 CCIOMCLOGDK = 50001;
	uint32 point_id = 5;
	uint32 dungeon_id = 14;
	bool _is_continue = 10;
}
