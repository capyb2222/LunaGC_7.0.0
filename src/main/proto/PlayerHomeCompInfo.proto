syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerHomeCompInfoOuterClass";

import "FriendEnterHomeOption.proto";

message PlayerHomeCompInfo {
	repeated uint32 unlocked_module_id_list = 50000;
	repeated uint32 seen_module_id_list = 6;
	FriendEnterHomeOption friend_enter_home_option = 10;
	repeated uint32 levelup_reward_got_level_list = 50001;
}
