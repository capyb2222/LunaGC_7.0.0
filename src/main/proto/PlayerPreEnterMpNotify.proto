syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerPreEnterMpNotifyOuterClass";

message PlayerPreEnterMpNotify {
	enum State {
		State_INVALID = 0;
		State_START = 1;
		State_TIMEOUT = 2;
	}
	State state = 8;
	string nickname = 13;
	uint32 uid = 6;
}
