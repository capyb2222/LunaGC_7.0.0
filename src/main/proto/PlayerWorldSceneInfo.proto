syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PlayerWorldSceneInfoOuterClass";

import "MapLayerInfo.proto";
import "_LimitedRegionInfo.proto";

message PlayerWorldSceneInfo {
	MapLayerInfo _map_layer_info = 1;
	uint32 scene_id = 3;
	_LimitedRegionInfo _limited_region_info = 7;
	bool is_locked = 12;
	repeated uint32 scene_tag_id_list = 15;
}
