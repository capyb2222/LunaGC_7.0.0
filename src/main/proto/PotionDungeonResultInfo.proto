syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PotionDungeonResultInfoOuterClass";

message PotionDungeonResultInfo {
	uint32 mode_id = 9;
	uint32 stage_id = 6;
	uint32 level_id = 15;
	uint32 left_time = 4;
	uint32 difficulty_level = 13;
	uint32 final_score = 1;
}
