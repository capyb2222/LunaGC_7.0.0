syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "PotionStageDataOuterClass";

import "PotionLevelData.proto";

message PotionStageData {
	repeated uint32 HLFNHDFMEEL = 50000;
	bool is_open = 6;
	repeated PotionLevelData level_list = 10;
	uint32 stage_id = 2;
	repeated uint32 MDEMNAHABEN = 50001;
}
