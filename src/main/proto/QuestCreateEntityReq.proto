syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "QuestCreateEntityReqOuterClass";

import "CreateEntityInfo.proto";

message QuestCreateEntityReq {
	uint32 quest_id = 12;
	CreateEntityInfo entity = 15;
	bool is_rewind = 13;
	uint32 parent_quest_id = 9;
}
