syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ReliquaryUpgradeRspOuterClass";

message ReliquaryUpgradeRsp {
	uint32 cur_level = 3;
	uint32 old_level = 4;
	repeated uint32 old_append_prop_list = 5;
	uint64 target_reliquary_guid = 7;
	uint32 power_up_rate = 10;
	int32 retcode = 13;
	repeated uint32 cur_append_prop_list = 15;
}
