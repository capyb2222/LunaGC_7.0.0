syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ReliquaryUpgradeRspOuterClass";

message ReliquaryUpgradeRsp {
	uint32 cur_level = 15;
	uint32 old_level = 5;
	repeated uint32 old_append_prop_list = 50000;
	uint64 target_reliquary_guid = 4;
	uint32 power_up_rate = 7;
	int32 retcode = 6;
	repeated uint32 cur_append_prop_list = 50001;
}
