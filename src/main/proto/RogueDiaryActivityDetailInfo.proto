syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "RogueDiaryActivityDetailInfoOuterClass";

import "RogueDiaryProgress.proto";
import "RogueDiaryStageInfo.proto";

message RogueDiaryActivityDetailInfo {
	bool is_content_closed = 5;
	bool is_have_progress = 9;
	repeated RogueDiaryStageInfo stage_list = 3;
	RogueDiaryProgress cur_progress = 4;
}
