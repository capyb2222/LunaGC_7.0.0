syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "SaveUgcReqOuterClass";

import "KLALGJNDAFD.proto";
import "UgcMusicBriefInfo.proto";
import "UgcMusicRecord.proto";
import "UgcType.proto";
import "_UgcLanV5CardBriefInfo.proto";
import "_UgcLanV5CardRecord.proto";
import "_UgcShortVideoRecord.proto";

message SaveUgcReq {
	oneof record {
		UgcMusicRecord music_record = 5;
		_UgcLanV5CardRecord lan_v5_card_record = 14;
		_UgcShortVideoRecord short_video_record = 15;
	}
	oneof brief {
		UgcMusicBriefInfo music_brief_info = 528;
		_UgcLanV5CardBriefInfo lan_v5_card_brief_info = 1842;
	}
	UgcType ugc_type = 6;
	KLALGJNDAFD ugctype_x = 10;
	uint32 schedule_id = 11;
}
