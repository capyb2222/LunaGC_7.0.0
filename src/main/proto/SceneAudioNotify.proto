syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "SceneAudioNotifyOuterClass";

message SceneAudioNotify {
	enum _SceneAudioBusinessType {
		NORMAL = 0;
		INSTRUMENT_WIDGET = 1;
	}
	uint32 source_uid = 4;
	int32 type = 8;
	_SceneAudioBusinessType business_type = 12;
	repeated string param3 = 2;
	repeated float param2 = 13;
	repeated uint32 param1 = 3;
}
