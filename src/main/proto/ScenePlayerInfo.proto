syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "ScenePlayerInfoOuterClass";

import "OnlinePlayerInfo.proto";

message ScenePlayerInfo {
	uint32 scene_id = 5;
	OnlinePlayerInfo online_player_info = 6;
	uint32 peer_id = 9;
	uint32 uid = 11;
	string name = 12;
	bool is_connected = 13;
}
