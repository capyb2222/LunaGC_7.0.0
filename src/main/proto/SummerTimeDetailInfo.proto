syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "SummerTimeDetailInfoOuterClass";

import "SummerTimeSprintBoatInfo.proto";
import "SummerTimeStageInfo.proto";

message SummerTimeDetailInfo {
	map<uint32, SummerTimeStageInfo> stage_map = 8;
	bool is_content_closed = 10;
	uint32 content_close_time = 14;
	SummerTimeSprintBoatInfo sprint_boat_info = 15;
}
