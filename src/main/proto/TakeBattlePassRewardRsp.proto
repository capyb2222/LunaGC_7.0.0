syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TakeBattlePassRewardRspOuterClass";

import "BattlePassRewardTakeOption.proto";
import "ItemParam.proto";

message TakeBattlePassRewardRsp {
	int32 retcode = 4;
	repeated ItemParam item_list = 7;
	repeated BattlePassRewardTakeOption take_option_list = 3;
}
