syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TeamEnterSceneInfoOuterClass";

import "AbilityControlBlock.proto";
import "AbilitySyncStateInfo.proto";
import "IDAKPKNODGC.proto";
import "ILFPMCGGMOA.proto";

message TeamEnterSceneInfo {
	AbilityControlBlock ability_control_block = 5;
	AbilitySyncStateInfo team_ability_info = 10;
	float _value = 8;
	repeated IDAKPKNODGC JFAHOBMFLFE = 11;
	ILFPMCGGMOA KAHECAKOMLD = 2;
	uint32 team_entity_id = 3;
}
