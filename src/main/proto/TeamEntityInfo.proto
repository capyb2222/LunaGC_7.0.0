syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TeamEntityInfoOuterClass";

import "AbilitySyncStateInfo.proto";
import "ILFPMCGGMOA.proto";

message TeamEntityInfo {
	AbilitySyncStateInfo team_ability_info = 1;
	uint32 authority_peer_id = 2;
	ILFPMCGGMOA KAHECAKOMLD = 5;
	uint32 team_entity_id = 14;
}
