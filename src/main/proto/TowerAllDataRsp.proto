syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TowerAllDataRspOuterClass";

import "TowerCurLevelRecord.proto";
import "TowerFloorRecord.proto";
import "TowerMonthlyBrief.proto";

message TowerAllDataRsp {
	enum _TowerSkipFloorState {
		TOWER_SKIP_FLOOR_STATE_NONE = 0;
		TOWER_SKIP_FLOOR_STATE_CAN_NOT_SKIP = 1;
		TOWER_SKIP_FLOOR_STATE_HAS_REWARD = 2;
		TOWER_SKIP_FLOOR_STATE_TAKEN_REWARD = 3;
	}
	uint32 tower_schedule_id = 1;
	uint32 EFABCDDNIFA = 2;
	uint32 next_schedule_change_time = 3;
	int32 retcode = 4;
	TowerCurLevelRecord cur_level_record = 5;
	uint32 commemorative_reward_id = 6;
	map<uint32, uint32> skip_floor_granted_reward_item_map = 7;
	bool is_finished_entrance_floor = 8;
	map<uint32, uint32> floor_open_time_map = 9;
	bool is_first_interact = 10;
	uint32 valid_tower_record_num = 11;
	uint32 skip_to_floor_index = 12;
	repeated TowerFloorRecord tower_floor_record_list = 13;
	uint32 GKIFECKDHKD = 14;
	TowerMonthlyBrief monthly_brief = 15;
	_TowerSkipFloorState _tower_skip_floor_state = 660;
	uint32 schedule_start_time = 1051;
	TowerMonthlyBrief last_schedule_monthly_brief = 1930;
}
