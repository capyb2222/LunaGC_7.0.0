syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TowerFloorRecordOuterClass";

import "TowerLevelRecord.proto";

message TowerFloorRecord {
	uint32 floor_id = 9;
	repeated TowerLevelRecord passed_level_record_list = 11;
	uint32 floor_star_reward_progress = 12;
	map<uint32, uint32> passed_level_map = 15;
}
