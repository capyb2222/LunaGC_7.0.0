syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TowerMonthlyBriefOuterClass";

message TowerMonthlyBrief {
	uint32 best_floor_index = 50000;
	uint32 best_level_index = 50001;
	uint32 total_star_count = 50002;
	uint32 tower_schedule_id = 50003;
}
