syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TreasureMapActivityDetailInfoOuterClass";

import "TreasureMapBonusChallengeInfo.proto";
import "TreasureMapRegionInfo.proto";

message TreasureMapActivityDetailInfo {
	uint32 min_open_player_level = 1;
	uint32 KDGCGILDGOH = 2;
	uint32 preview_reward_id = 4;
	uint32 FMCDPDEMHLH = 6;
	repeated TreasureMapRegionInfo region_info_list = 8;
	bool is_mp_challenge_touched = 10;
	repeated TreasureMapBonusChallengeInfo bonus_challenge_list = 12;
	uint32 fjeocgnlcej = 13;
	uint32 treasure_close_time = 15;
}
