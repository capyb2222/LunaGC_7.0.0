syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TreasureMapBonusChallengeInfoOuterClass";

message TreasureMapBonusChallengeInfo {
	uint32 solution_id = 6;
	bool is_done = 7;
	bool is_active = 8;
	map<uint32, bool> fragment_map = 9;
	uint32 config_id = 10;
}
