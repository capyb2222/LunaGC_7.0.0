syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TreasureMapRegionInfoOuterClass";

import "Vector.proto";

message TreasureMapRegionInfo {
	uint32 scene_id = 4;
	Vector region_center_pos = 15;
	uint32 start_time = 12;
	bool CNKNEJNEEOP = 50000;
	uint32 lkcmdifkamb = 50001;
	uint32 region_radius = 1;
	bool PANBKFCPEBJ = 50002;
	uint32 region_id = 9;
	uint32 fggbkhfbkdp = 50003;
}
