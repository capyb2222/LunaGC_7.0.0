syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "TreasureSeelieRegionDataOuterClass";

import "Vector.proto";

message TreasureSeelieRegionData {
	uint32 open_time = 5;
	bool is_open = 8;
	uint32 OKGPCPGPPMG = 50000;
	Vector region_center_pos = 3;
	uint32 region_id = 11;
	uint32 scene_id = 7;
	uint32 LPGPONIONFK = 50001;
	uint32 pdhmghbaedh = 50002;
	bool is_done = 10;
	float region_radius = 1;
}
