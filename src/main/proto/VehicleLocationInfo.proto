syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "VehicleLocationInfoOuterClass";

import "Vector.proto";

message VehicleLocationInfo {
	uint32 gadget_id = 7;
	repeated uint32 uid_list = 13;
	float max_hp = 14;
	uint32 entity_id = 12;
	Vector rot = 5;
	uint32 owner_uid = 2;
	Vector pos = 1;
	float cur_hp = 8;
}
