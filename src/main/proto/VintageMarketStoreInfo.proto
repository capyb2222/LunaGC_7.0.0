syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "VintageMarketStoreInfoOuterClass";

message VintageMarketStoreInfo {
	repeated uint32 GLINPEAHPKI = 1;
	repeated uint32 HHJEAFJANAD = 2;
	repeated uint32 strategy_list = 3;
	uint32 store_id = 10;
	uint32 slot_count = 11;
}
