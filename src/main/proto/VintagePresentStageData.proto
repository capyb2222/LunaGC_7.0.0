syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "VintagePresentStageDataOuterClass";

import "VintagePresentLevelData.proto";

message VintagePresentStageData {
	uint32 stage_id = 1;
	map<uint32, VintagePresentLevelData> present_level_map = 9;
	bool is_finish = 4;
	bool is_open = 6;
	uint32 open_time = 14;
}
