syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "WeaponAwakenRspOuterClass";

message WeaponAwakenRsp {
	uint64 avatar_guid = 13;
	map<uint32, uint32> cur_affix_level_map = 9;
	uint32 target_weapon_awaken_level = 4;
	map<uint32, uint32> old_affix_level_map = 14;
	int32 retcode = 2;
	uint64 target_weapon_guid = 6;
}
