syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "WidgetCreatorInfoOuterClass";

import "WidgetCreateLocationInfo.proto";
import "WidgetCreatorOpType.proto";

message WidgetCreatorInfo {
	uint32 entity_id = 13;
	WidgetCreatorOpType op_type = 1;
	WidgetCreateLocationInfo location_info = 15;
}
