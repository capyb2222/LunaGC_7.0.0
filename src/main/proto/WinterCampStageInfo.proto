syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "WinterCampStageInfoOuterClass";

import "Vector.proto";

message WinterCampStageInfo {
	uint32 id = 6;
	Vector pos = 12;
	uint32 cur_progress = 9;
	uint32 open_time = 1;
	bool is_finished = 15;
	uint32 total_progress = 2;
}
