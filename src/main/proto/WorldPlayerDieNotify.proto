syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "WorldPlayerDieNotifyOuterClass";

import "AbilityString.proto";
import "PlayerDieType.proto";

message WorldPlayerDieNotify {
	oneof entity {
		uint32 monster_id = 5;
		uint32 gadget_id = 2;
	}
	PlayerDieType die_type = 1;
	AbilityString cfadgphidli = 15;
	uint32 OBOKABMLGHI = 50000;
	uint32 AOMDIHGJMNK = 50001;
	uint32 murderer_entity_id = 50002;
}
