syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_BadgetBattleSettleInfoOuterClass";

message _BadgetBattleSettleInfo {
	uint32 difficulty = 15;
	bool is_new_record = 3;
	uint32 level_id = 6;
	repeated uint32 LLDFKPKHFFB = 12;
	uint32 score = 8;
}
