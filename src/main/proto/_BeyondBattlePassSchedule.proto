syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_BeyondBattlePassScheduleOuterClass";

import "_BeyondBattlePassUnlockStatus.proto";

message _BeyondBattlePassSchedule {
	uint32 point = 7;
	bool is_extra_paid_reward_taken = 12;
	_BeyondBattlePassUnlockStatus unlock_status = 8;
	uint32 level = 4;
	uint32 end_time = 5;
	uint32 begin_time = 10;
	uint32 schedule_id = 14;
}
