syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_BulletHellSettleInfoOuterClass";

message _BulletHellSettleInfo {
	uint32 level_id = 1;
	bool is_new_record = 2;
	uint32 GMCOKCLLBCL = 3;
	uint32 NGJGHEBLBHN = 4;
	uint32 MMKMPGFBOIL = 9;
	uint32 score = 13;
}
