syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_InspirationSpurtDungeonSettleInfoOuterClass";

message _InspirationSpurtDungeonSettleInfo {
	bool is_new_record = 5;
	uint32 level_id = 9;
	uint32 score = 3;
	uint32 use_time = 11;
	uint32 kill_monster_num = 7;
}
