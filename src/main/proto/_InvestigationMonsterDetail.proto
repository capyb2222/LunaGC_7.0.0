syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_InvestigationMonsterDetailOuterClass";

import "Vector.proto";
import "WeeklyBossResinDiscountInfo.proto";
import "_InvestigationMonsterConfig.proto";

message _InvestigationMonsterDetail {
	uint32 max_boss_chest_num = 1;
	bool is_alive = 2;
	bool _is_respawning = 3;
	uint32 refresh_interval = 4;
	uint32 resin = 5;
	uint32 next_refresh_time = 6;
	uint32 boss_chest_num = 8;
	bool is_area_locked = 9;
	uint32 level = 10;
	uint32 _map_layer_id = 11;
	WeeklyBossResinDiscountInfo weekly_boss_resin_discount_info = 12;
	uint32 next_boss_chest_refresh_time = 13;
	_InvestigationMonsterConfig _monster_config = 14;
	Vector pos = 15;
}
