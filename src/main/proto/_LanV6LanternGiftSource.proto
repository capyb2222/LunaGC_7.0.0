syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_LanV6LanternGiftSourceOuterClass";

import "EDLMACJNHGP.proto";
import "FIEHCAPFKFI.proto";

message _LanV6LanternGiftSource {
	oneof detail {
