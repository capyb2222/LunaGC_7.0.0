syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_LanternRiteV6BattleSettleInfoOuterClass";

message _LanternRiteV6BattleSettleInfo {
	uint32 level_id = 8;
	uint32 score = 15;
	uint32 difficulty = 14;
	uint32 use_time = 1;
	bool is_new_record = 10;
}
