syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_LanternRiteV6CardInfoOuterClass";

import "_LanV6CardDetail.proto";
import "_LanV6LanternGiftDetail.proto";

message _LanternRiteV6CardInfo {
	uint32 _claimed_gift_num = 5;
	repeated _LanV6LanternGiftDetail _card_gift_list = 14;
	repeated _LanV6CardDetail _card_template_list = 15;
}
