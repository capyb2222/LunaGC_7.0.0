syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_LoliRunDungeonSettleInfoOuterClass";

message _LoliRunDungeonSettleInfo {
	uint32 DOCOKIPMPKN = 4;
	uint32 hit_point = 5;
	uint32 score = 10;
	uint32 level_id = 11;
	uint32 collect_num = 12;
	bool is_new_record = 13;
}
