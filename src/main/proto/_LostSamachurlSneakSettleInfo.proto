syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_LostSamachurlSneakSettleInfoOuterClass";

import "GalleryStopReason.proto";

message _LostSamachurlSneakSettleInfo {
	uint32 level_id = 11;
	bool is_new_record = 1;
	GalleryStopReason reason = 13;
	uint32 cost_time = 8;
}
