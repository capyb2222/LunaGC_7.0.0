syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_MirrorWorldSceneDetailOuterClass";

import "MapLayerInfo.proto";

message _MirrorWorldSceneDetail {
	MapLayerInfo _map_layer_info = 14;
	uint32 _mirrored_scene_id = 13;
	repeated uint32 scene_tag_id_list = 4;
}
