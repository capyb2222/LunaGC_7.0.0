syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_MonsterChessCardDetailOuterClass";

message _MonsterChessCardDetail {
	uint32 guid = 3;
	uint32 _card_star_num = 50000;
	uint32 _card_level = 50001;
	uint32 card_id = 9;
	uint32 _card_extra_level = 8;
}
