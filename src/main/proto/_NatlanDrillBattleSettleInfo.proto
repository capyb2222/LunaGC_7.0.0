syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_NatlanDrillBattleSettleInfoOuterClass";

message _NatlanDrillBattleSettleInfo {
	bool is_new_record = 1;
	uint32 level_id = 8;
	uint32 difficulty = 9;
	uint32 cost_time = 6;
	repeated uint32 DLDAJAHOKNI = 13;
	uint32 CJNILLPKODC = 14;
}
