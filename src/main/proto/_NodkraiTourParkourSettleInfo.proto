syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_NodkraiTourParkourSettleInfoOuterClass";

import "GalleryStopReason.proto";

message _NodkraiTourParkourSettleInfo {
	uint32 IMONKEJDJCA = 50000;
	uint32 _max_collect_num = 8;
	bool is_new_record = 9;
	uint32 collect_num = 12;
	GalleryStopReason reason = 7;
	uint32 use_time = 13;
	uint32 CFLAKMKGAMO = 50001;
	uint32 score = 15;
}
