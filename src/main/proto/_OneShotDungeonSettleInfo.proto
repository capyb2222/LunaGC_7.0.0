syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_OneShotDungeonSettleInfoOuterClass";

message _OneShotDungeonSettleInfo {
	uint32 level_id = 11;
	uint32 score = 1;
	uint32 AHMFDCPCCGF = 50000;
	uint32 GAMLOHOKPAJ = 50001;
	uint32 MGGJPDGCECM = 50002;
	bool is_new_record = 5;
}
