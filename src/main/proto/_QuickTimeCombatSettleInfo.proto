syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_QuickTimeCombatSettleInfoOuterClass";

message _QuickTimeCombatSettleInfo {
	uint32 stage_id = 3;
	uint32 total_score = 13;
	bool is_new_record = 11;
	uint32 difficulty = 1;
	repeated uint32 KKBGBCAOLAP = 9;
}
