syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_RankedMatchShootingSettleInfoOuterClass";

import "GalleryStopReason.proto";

message _RankedMatchShootingSettleInfo {
	uint32 item_num = 9;
	uint32 score = 5;
	uint32 MOEKEMAHBNN = 3;
	GalleryStopReason reason = 1;
	uint32 level_id = 14;
	bool is_new_record = 7;
}
