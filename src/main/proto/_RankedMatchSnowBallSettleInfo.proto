syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_RankedMatchSnowBallSettleInfoOuterClass";

import "GalleryStopReason.proto";

message _RankedMatchSnowBallSettleInfo {
	bool is_new_record = 10;
	GalleryStopReason reason = 8;
	uint32 score = 4;
	uint32 level_id = 11;
	uint32 item_num = 12;
}
