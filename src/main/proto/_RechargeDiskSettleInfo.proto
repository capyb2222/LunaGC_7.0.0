syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_RechargeDiskSettleInfoOuterClass";

message _RechargeDiskSettleInfo {
	uint32 NNOCIHNFLNI = 10;
	uint32 difficulty = 14;
	uint32 level_id = 9;
	repeated uint32 score_list = 12;
	bool is_new_record = 11;
}
