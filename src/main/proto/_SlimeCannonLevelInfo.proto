syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_SlimeCannonLevelInfoOuterClass";

message _SlimeCannonLevelInfo {
	uint32 level_id = 3;
	uint32 use_time = 15;
	uint32 score = 10;
	bool is_open = 8;
	uint32 _max_combo_num = 4;
	uint32 _max_wave = 2;
	bool is_finish = 12;
}
