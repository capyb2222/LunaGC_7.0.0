syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_SumeruAdventureTrainingSettleInfoOuterClass";

message _SumeruAdventureTrainingSettleInfo {
	uint32 play_type = 1;
	uint32 difficulty = 3;
	uint32 level_id = 4;
	uint32 use_time = 9;
	bool is_new_record = 12;
	uint32 score = 13;
	uint32 collect_num = 15;
}
