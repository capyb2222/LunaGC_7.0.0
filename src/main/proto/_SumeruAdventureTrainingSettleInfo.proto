syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_SumeruAdventureTrainingSettleInfoOuterClass";

message _SumeruAdventureTrainingSettleInfo {
	uint32 play_type = 10;
	uint32 difficulty = 13;
	uint32 level_id = 9;
	uint32 use_time = 15;
	bool is_new_record = 2;
	uint32 score = 3;
	uint32 collect_num = 1;
}
