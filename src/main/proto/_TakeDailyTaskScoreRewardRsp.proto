syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_TakeDailyTaskScoreRewardRspOuterClass";

import "ItemParam.proto";

message _TakeDailyTaskScoreRewardRsp {
	repeated ItemParam item_list = 5;
	bool _is_claim_daily_attendance = 6;
