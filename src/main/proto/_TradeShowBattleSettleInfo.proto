syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_TradeShowBattleSettleInfoOuterClass";

message _TradeShowBattleSettleInfo {
	uint32 level_id = 15;
	uint32 GBHMBBOAMLK = 50000;
	uint32 score = 4;
	uint32 difficulty_id = 2;
	bool is_new_record = 11;
	uint32 NKMECOILMIO = 50001;
}
