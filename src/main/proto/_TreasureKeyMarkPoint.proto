syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_TreasureKeyMarkPointOuterClass";

import "Vector.proto";

message _TreasureKeyMarkPoint {
	Vector _mark_pos = 1;
	uint32 _mark_scene_id = 3;
	uint32 group_id = 4;
	uint32 _mark_map_layer_id = 8;
	uint32 material_id = 9;
	uint32 config_id = 13;
	bool is_active = 6;
}
