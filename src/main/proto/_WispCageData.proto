syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "_WispCageDataOuterClass";

import "ItemParam.proto";
import "Vector.proto";
import "_WispCageState.proto";

message _WispCageData {
	Vector rot = 9;
	uint32 scene_id = 11;
	uint32 gadget_entity_id = 6;
	Vector pos = 14;
	repeated ItemParam _last_used_material_list = 10;
	_WispCageState state = 12;
	uint32 _collect_finish_time = 8;
}
